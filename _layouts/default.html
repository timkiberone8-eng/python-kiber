<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page.title }}</title>
<script>
  try {
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch {}
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #0d1117);
    --ink: light-dark(#1f2328, #e6edf3);
    --muted: light-dark(#59636e, #9198a1);
    --line: light-dark(#d1d9e0, #3d444d);
    --soft: light-dark(#f6f8fa, #151b23);
    --link: light-dark(#0969da, #4493f8);
    --ok: light-dark(#1a7f37, #3fb950);
    --hl-keyword: light-dark(#cf222e, #ff7b72);
    --hl-string: light-dark(#0a3069, #a5d6ff);
    --hl-number: light-dark(#0550ae, #79c0ff);
    --hl-comment: light-dark(#59636e, #9198a1);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  @media (max-width: 600px) { main { padding-top: 56px; } }
  h1 { font-size: 2em; line-height: 1.25; margin: 0 0 16px; }
  h2 { font-size: 1.5em; margin: 40px 0 16px; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.25em; margin: 32px 0 12px; }
  p, ul, table, pre, details { margin: 0 0 16px; }
  a { color: var(--link); }
  code { font: .9em Consolas, "Cascadia Mono", monospace; background: var(--soft);
    padding: .15em .35em; border-radius: 6px; }
  pre { background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: .875em; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  th { background: var(--soft); }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 0 16px; }
  details[open] { padding-bottom: 4px; }
  summary { cursor: pointer; color: var(--link); padding: 10px 0; }
  .spoiler { background: var(--line); color: transparent; cursor: pointer; border-radius: 4px;
    padding: 2px 4px; user-select: none; transition: background .15s, color .15s;
    box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .spoiler:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .spoiler:not(.open) * { color: transparent !important; background: transparent !important; }
  .spoiler.open { background: transparent; color: inherit; user-select: text; }
  .highlighter-rouge { position: relative; }
  .copy { position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
    width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--muted); cursor: pointer; }
  .copy:hover { color: var(--ink); background: var(--soft); }
  .copy:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .copy svg { width: 16px; height: 16px; fill: currentColor; }
  .copy .done, .copy.copied .idle { display: none; }
  .copy.copied .done { display: block; }
  .copy.copied { color: var(--ok); border-color: var(--ok); }
  .theme { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; padding: 0;
    border: 0; border-radius: 50%; background: none; cursor: pointer; opacity: .22;
    color: light-dark(#e3a008, #b9cdf5); -webkit-tap-highlight-color: transparent;
    transition: opacity .35s, filter .35s; }
  .theme:not(.dark) { opacity: .4; }
  .theme:hover, .theme.awake, .theme:focus-visible { opacity: 1;
    filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 10px currentColor); }
  .theme:focus-visible { outline: none; }
  .theme svg { position: absolute; inset: 8px; width: 24px; height: 24px; fill: none;
    stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
    transition: opacity .5s, transform .6s cubic-bezier(.4, 0, .2, 1); }
  .theme .moon { fill: currentColor; stroke: none; }
  .theme .moon, .theme.dark .sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
  .theme.dark .moon { opacity: 1; transform: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  .highlight .k, .highlight .kd, .highlight .kt, .highlight .ow { color: var(--hl-keyword); }
  .highlight .s, .highlight .s1, .highlight .s2 { color: var(--hl-string); }
  .highlight .mi, .highlight .mf, .highlight .m { color: var(--hl-number); }
  .highlight .c, .highlight .c1, .highlight .cm { color: var(--hl-comment); font-style: italic; }
</style>
</head>
<body>
<button type="button" class="theme" aria-label="Сменить тему"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1Z"/></svg></button>
<main>
{{ content }}
</main>
<script>
  const root = document.documentElement;
  const themeButton = document.querySelector(".theme");
  const systemDark = matchMedia("(prefers-color-scheme: dark)");
  const touchOnly = matchMedia("(hover: none)");
  const quiet = matchMedia("(prefers-reduced-motion: reduce)");
  const currentTheme = () => root.dataset.theme || (systemDark.matches ? "dark" : "light");
  const showTheme = () => themeButton.classList.toggle("dark", currentTheme() === "dark");
  showTheme();
  systemDark.addEventListener("change", showTheme);
  let sleep;
  const wake = () => {
    themeButton.classList.add("awake");
    clearTimeout(sleep);
    sleep = setTimeout(() => themeButton.classList.remove("awake"), 3000);
  };
  themeButton.addEventListener("click", () => {
    if (touchOnly.matches && !themeButton.classList.contains("awake")) {
      wake();
      return;
    }
    const next = currentTheme() === "dark" ? "light" : "dark";
    const apply = () => {
      root.dataset.theme = next;
      showTheme();
      try { localStorage.setItem("theme", next); } catch {}
    };
    if (touchOnly.matches) wake();
    if (!document.startViewTransition || quiet.matches) {
      apply();
      return;
    }
    const box = themeButton.getBoundingClientRect();
    const x = box.left + box.width / 2;
    const y = box.top + box.height / 2;
    const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => {
      root.animate(
        { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
        { duration: 700, easing: "cubic-bezier(.4, 0, .2, 1)", pseudoElement: "::view-transition-new(root)" }
      );
    });
  });

  const copyIcons = `<svg class="idle" viewBox="0 0 16 16" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg><svg class="done" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>`;
  document.querySelectorAll(".copyable div.highlighter-rouge").forEach(block => {
    const code = block.querySelector("pre");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy";
    button.innerHTML = copyIcons;
    const setLabel = label => { button.title = label; button.setAttribute("aria-label", label); };
    setLabel("Копировать");
    let reset;
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(code.innerText.trimEnd());
        button.classList.add("copied");
        setLabel("Скопировано");
      } catch {
        button.classList.remove("copied");
        setLabel("Не скопировалось, выдели код и нажми Ctrl+C");
      }
      clearTimeout(reset);
      reset = setTimeout(() => {
        button.classList.remove("copied");
        setLabel("Копировать");
      }, 2000);
    });
    block.appendChild(button);
  });

  document.addEventListener("click", (e) => {
    const s = e.target.closest(".spoiler");
    if (s) s.classList.toggle("open");
  });
  document.addEventListener("keydown", (e) => {
    const s = e.target.closest(".spoiler");
    if (s && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      s.classList.toggle("open");
    }
  });
</script>
</body>
</html>
