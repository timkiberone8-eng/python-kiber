<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #000;
            background-color: #cec4a2;
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.5;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 36px;
            line-height: 1.2;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .products li {
            width: 220px;
            max-width: 100%;
            padding: 16px;
            border: 1px solid #bacbc0;
            border-radius: 12px;
            background-color: #fff;
            overflow-wrap: anywhere;
        }

        .products-name {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .product-price {
            color: #1d503a
        }
    </style>
</head>

<body>
    <main>

        <h1>Каталог товаров</h1>

        <form class="budget-form" method="get">
            <label for="max-price">Бюдже до, Р</label>
        </form>

        {% if products %}

        <ul class="products">
            {% for product in products %}
            <li>
                <span class="product-name">{{ product.name }}</span>
                <span class="product-price">{{ product.price }}</span>
            </li>
            {% endfor %}
        </ul>

        {% else %}
            <p>По этой цене товаров нет</p>
        {% endif %}

    </main>
</body>

</html>
