<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #7700ff;
            background-color: #121212;

            /* 2. Второй цвет из правого нижнего угла, рассеивающийся к центру */
            background-image: radial-gradient(circle at bottom right,
                    rgb(149, 0, 255) 0%,
                    transparent 60%);
            font-size: 18px;

        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            margin-top: 20px;
            font-size: 36px;
            line-height: 1.2;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .products li {
            width: 220px;
            max-width: 100%;
            padding: 16px;
            border: 1px solid white;
            border-radius: 12px;
            background-color: #121212;
            overflow: anywhere;
        }

        .product-name {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .product-price {
            color:#7700ff;
        }
    </style>
</head>

<body>
    <main>

        <h1>Каталог товаров</h1>
        {% if products %}

        <ul class="products">
            {% for product in products %}
            <li>
                <span class="product-name">{{ product.name }}</span>
                <span class="product-price">{{ product.price }}</span>
            </li>
            {% endfor %}
        </ul>

        {% else %}
        <p>По этой цене товаров нет</p>
        {% endif %}

    </main>
</body>

</html>
